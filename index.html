<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006e78" />

    <title>RYCO Coffee House | Coffee, Acai Bowls & Brunch in Moy</title>
    <meta
      name="description"
      content="RYCO Coffee House in Moy, Dungannon (Co. Tyrone). Freshly made coffee, acai bowls, smoothies, traybakes, toasties and breakfast pots. Open Wednesday to Monday."
    />
    <!-- When moving to a custom domain, update canonical + og:url + og:image + JSON-LD url to https://rycocoffeehouse.com/ -->
    <link rel="canonical" href="https://chrismac860.github.io/RYCOCOFFEESHOPPRACTICE/" />

    <!-- Favicon (uses the RYCO logo) -->
    <link rel="icon" href="/images/ryco-official-logo-cropped.png" />
    <link rel="apple-touch-icon" href="/images/ryco-official-logo.png" />

    <!-- Open Graph (Facebook / Instagram / WhatsApp link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RYCO Coffee House" />
    <meta property="og:title" content="RYCO Coffee House | Coffee, Acai Bowls & Brunch in Moy" />
    <meta
      property="og:description"
      content="Coffee, acai bowls, smoothies, traybakes and toasties from a bright local coffee house in the Moy. Open Wednesday to Monday."
    />
    <meta property="og:url" content="https://chrismac860.github.io/RYCOCOFFEESHOPPRACTICE/" />
    <meta property="og:image" content="https://chrismac860.github.io/RYCOCOFFEESHOPPRACTICE/images/ryco-restaurantguru-photo.jpg" />
    <meta property="og:image:alt" content="RYCO Coffee House blue storefront on Killyman Street, Moy" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RYCO Coffee House | Moy" />
    <meta
      name="twitter:description"
      content="Coffee, acai bowls, smoothies and counter food from a bright local coffee house in the Moy."
    />
    <meta name="twitter:image" content="https://chrismac860.github.io/RYCOCOFFEESHOPPRACTICE/images/ryco-restaurantguru-photo.jpg" />

    <!-- LocalBusiness structured data: helps RYCO appear in local Google search with hours, phone and map. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "RYCO Coffee House",
        "image": "https://chrismac860.github.io/RYCOCOFFEESHOPPRACTICE/images/ryco-restaurantguru-photo.jpg",
        "url": "https://chrismac860.github.io/RYCOCOFFEESHOPPRACTICE/",
        "telephone": "+447749175885",
        "priceRange": "££",
        "servesCuisine": ["Coffee", "Brunch", "Acai bowls", "Smoothies", "Toasties"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "30 Killyman Street",
          "addressLocality": "Moy, Dungannon",
          "addressRegion": "County Tyrone",
          "postalCode": "BT71 7SJ",
          "addressCountry": "GB"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 54.4487,
          "longitude": -6.674
        },
        "sameAs": [
          "https://www.instagram.com/ryco_coffee_house/",
          "https://www.facebook.com/rycocoffeehouse/"
        ],
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Monday", "opens": "09:00", "closes": "16:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Wednesday", "opens": "09:00", "closes": "16:30" },

          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "09:00", "closes": "15:00" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
